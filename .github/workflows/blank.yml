name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Tests
        run: |
          pytest


  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build             -t ${{ secrets.DOCKERHUB_USERNAME }}/vspire-website:latest .

      - name: Push Docker Image
        run: |
          docker push             ${{ secrets.DOCKERHUB_USERNAME }}/vspire-website:latest


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "Pulling latest Docker image..."

            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/vspire-website:latest

            echo "Stopping old container..."

            sudo docker stop vspire-website || true

            echo "Removing old container..."

            sudo docker rm vspire-website || true

            echo "Starting new container..."

            sudo docker run -d               --name vspire-website               -p 80:8000               ${{ secrets.DOCKERHUB_USERNAME }}/vspire-website:latest

            echo "Checking container..."

            sudo docker ps

            echo "Deployment successful!"
